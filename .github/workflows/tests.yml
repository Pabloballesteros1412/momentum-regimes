name: tests

# Runs the full test suite. Every test uses synthetic data or files committed
# to the repo (fixtures, results/, web/data/); none needs network access or
# the gitignored price cache.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -q -p no:cacheprovider test_*.py --cov=quantbt --cov-report=term --cov-fail-under=85
